- appendix: A
  heading: Glossary
  text: |
    **Dikirion** — the two-branched candlestick, signifying the two
    natures of Christ. **Trikirion** — the three-branched candlestick,
    signifying the Trinity.

    **Zhezl** — the bishop's staff. Written *jezel* in some of the
    notes; the same object is called simply "the staff" elsewhere, and
    one spelling should win before this is published.

    **Orlets** — the eagle rug the bishop stands on.      

- appendix: B
  heading: Assigning Subdeacons and Altar Servers
  text: |
    The rubrics above call on subdeacons throughout.  You may have to
    appoint one or even two subdeacons choosing adult, experienced
    altar servers for the role.  They should be vested and know the 
    whole sequence beforehand — this is not a role to hand to someone
    on the day.  Another option is to have deacons act as subdeacons.

    Where there are no subdeacons, the two senior altar servers,
    unless blessed to do so
    do not vest as subdeacons
    and do not handle the dikirion and trikirion at the blessing.

    Another important role, is the altar server who will bring out the
    bowl, pitcher and towel for the washing of the Bishops hands.
    Usually this is a junior server who will be greatly encouraged by
    playing this important role.

    Optimally you will have at least two more adult servers who will carry
    the fans, and who will keep an eye on things on
    the north and south sides of the altar is a good idea.  They should
    watch the subdeacons for direction, and can be a great help in 
    keeping things running smoothly by paying attention.

    Additional altar servers can carry lamps in the entrances, and should
    behind the other clergy and servers.  See the little and great entrances
    for details.  Also try to line the servers up symmetrically if possible:
    for example if you have two smaller boys carrying lamps and one larger boy, 
    the larger boy should be in the middle.
      

- appendix: C
  heading: A Note on the Spiritual role of Altar Servers
  text: | 
     The following analogy may be useful in helping younger boys to stay focused
     and on task:

     Christians, and especially Orthodox Christians are like God's special forces.
     We are in the world taking back territory that has been stolen by the evil 
     one.

     The temple in which we meet is like a protected forward fort in enemy territory.
     When we are in the temple, we are in a safe place, with more protection from
     evil than in the outside world.  We come to the temple to be healed from our
     wounds, to rest, and to be trained for the next battle.

     But at any fort you will always have guards, and that is precisely what the
     altar servers are.  And the more alert and focused the servers on their duty
     no matter how small it may seem, the harder time the enemy will have in attacking
     our fort.


- appendix: D
  heading: Serving with More or Less than Two Deacons
  text: |
    The rubrics and video above have assumed two deacons, which is the normal case
    at a hierarchical liturgy. Where fewer are available the duties do
    not disappear; they are reassigned.

    With one deacon, he takes the first and second deacon's part throughout, and
    the litanies that would alternate fall to him.  
    
    *Consult the Bishop or your*
    *Dean to determine how to handle the "washing of the hands", and censing*
    *during the Cherubic Hymn, which are normally done simultaneously with the
    second Deacon*

    Where there are more than two deacons, the third and fourth deacons are given
    some of the roles of the second deacon, and subdeacons as well.

    The following chart shows the typical roles for 2-8 Deacons serving at a 
    liturgy.  Read across for each liturgical action, and stop at the column 
    for the number of deacons serving.  That will determine which deacon(s) 
    perform that role.

    *Note: If there are less than 4 deacons, the Trikiri and Dikiri are carried
    by Subdeacons, and the Fans by either subdeacons or altar servers.*

    @print A version sized to be cut out and kept in a service book is at the
    end of this document, under **Pages to Cut Out**.

    ![Roles for concelebrating deacons](art/roles_chart.png "card")

    @screen A version sized to be cut out and kept in a service book is available
    as a printable sheet: [download the card](https://catmando.github.io/diaconal-training/roles_card.pdf).

    @screen Note: Print it at **100 percent** — not "fit to page", which would shrink it — and
    cut along the dashed line.

- appendix: E
  heading: Pages to Cut Out and Add to the Liturgy Book
  text: |
    Where a hierarchical liturgy departs from the ordinary one, the difference
    is easier to keep in the book than in the head. The pages below are set to
    the size and type of the service book itself, so a printed one can take the
    place of the handwritten note most of us end up making.

    Each is printed on one side only: paste the blank side over the page it
    replaces, and where a piece spans two facing pages, fold it down the middle
    into the gutter first.

    @print The sheets themselves are gathered at the end of this document,
    under **Pages to Cut Out**, each at the size it should be cut to.

    **Page 56 — the completion of the vesting.** This page adds rubrics for the
    completion of the vesting of the Bishop; it is pasted over page 56.

    @screen [Download the page](https://catmando.github.io/diaconal-training/page_56.pdf).

    @print ![Page 56, the completion of the vesting](art/page_56.png "card 3.625x5.875")

    **Pages 64–65 — the entrance prayers.** The ordinary entrance prayers, with
    the hierarchical addition set where it belongs: after the priest's prayer
    the deacon and choir intone *Ton Despótēn*, which is answered often and
    mispronounced easily, so it is given here with its pronunciation. The
    ordinary rite then resumes on page 65, undisturbed.

    @screen [Download the sheet](https://catmando.github.io/diaconal-training/pages_64_65.pdf).

    @print ![Pages 64-65, the entrance prayers](art/insert_64_65.png "card 7.25x5.875")

    **Pages 136–137 — the great commemoration.** From the offering through
    *Is Polla Eti Despota*. This one spans the open book, so it folds into the
    gutter and is pasted over both facing pages.

    @screen [Download the sheet](https://catmando.github.io/diaconal-training/insert_136_137.pdf).

    @print ![Pages 136-137 for a hierarchical liturgy](art/insert_136_137.png "card 7.25x5.875")
